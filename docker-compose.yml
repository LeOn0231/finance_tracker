# Life Quest — Independent Local MySQL 8.0 Development Service
# Completely isolated from any company or work database infrastructure

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lifequest-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode="STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    environment:
      MYSQL_DATABASE: lifequest
      MYSQL_USER: quest_admin
      MYSQL_PASSWORD: QuestSecret2025!
      MYSQL_ROOT_PASSWORD: RootQuestSecret2025!
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - lifequest_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootQuestSecret2025!"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifequest_mysql_data:
    driver: local
